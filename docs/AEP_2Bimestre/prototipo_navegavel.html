<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaúdeTech Vistorias | Protótipo</title><style>
:root{--n:#12304a;--t:#087f8c;--bg:#f4f7fa;--line:#dbe5ea;--mut:#687d89;--red:#b84249;--green:#188269;--amber:#a86d13}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Segoe UI,Arial,sans-serif;color:#1d2d37}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--n);color:#eaf3f7;padding:22px 15px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 25px}.logo{background:#45c2b0;color:#06333c;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:20px;font-weight:900}.brand small{display:block;color:#b2c7d0}.nav{display:grid;gap:6px}.nav button{background:none;text-align:left;color:#bed0d9}.nav button.active,.nav button:hover{background:#24475d;color:#fff}.foot{margin-top:auto;color:#9db3bd;font-size:11px;padding:10px}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 4vw;display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:13px}.avatar{display:inline-grid;place-items:center;border-radius:50%;width:34px;height:34px;background:#dff5f0;color:var(--t);font-weight:800;margin-left:10px}.content{max-width:1220px;margin:auto;padding:30px 4vw 55px}.eyebrow{font-size:11px;color:var(--t);font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:29px;color:var(--n);margin:4px 0}h2{font-size:17px;color:var(--n);margin:0 0 12px}p{color:var(--mut);margin:5px 0}.head{display:flex;justify-content:space-between;gap:15px;margin-bottom:22px}.head .desc{max-width:700px}.primary{background:var(--t);color:white}.secondary{background:#e8f2f4;color:var(--n)}.ghost{background:white;border:1px solid var(--line);color:var(--n)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.cols{grid-template-columns:1.15fr .85fr}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 8px 24px #12304a10}.metric small{color:var(--mut);font-size:12px}.metric strong{display:block;color:var(--n);font-size:26px;margin:5px 0}.metric span{font-size:11px;color:var(--t)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:9px 7px;border-bottom:1px solid var(--line)}.table td{padding:11px 7px;border-bottom:1px solid #edf1f4;font-size:12px}.badge{display:inline-block;border-radius:20px;padding:4px 8px;background:#e4f4ef;color:var(--green);font-size:10px;font-weight:750}.warn{background:#fff3df;color:var(--amber)}.bad{background:#fff0f0;color:var(--red)}.bar{display:grid;grid-template-columns:1.1fr 2fr 23px;gap:8px;align-items:center;margin:10px 0;font-size:11px}.track{height:8px;background:#edf2f5;border-radius:20px}.fill{height:100%;background:#15999a;border-radius:20px}.steps{display:flex;align-items:center;gap:7px;margin:12px 0 20px;font-size:11px;color:var(--mut)}.step{padding:7px 10px;border-radius:20px;background:#e8eef1}.step.on{background:var(--n);color:white}.sep{height:1px;background:var(--line);flex:1}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-weight:700;color:var(--n);font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd9df;border-radius:8px;padding:10px 11px;background:#fff}.field textarea{min-height:70px}.span2{grid-column:span 2}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.callout,.notice{background:#f0f7fa;padding:11px;border-radius:9px;color:#526b78;font-size:11px;margin:12px 0}.notice{background:#fff7e8;border-left:3px solid var(--amber);color:#715622}.item{border:1px solid var(--line);border-radius:11px;padding:14px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.item p{color:#243842;font-size:13px}.answers{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.answers button{padding:7px 9px;background:#eef3f5;color:#405662;font-size:10px}.answers .ok{background:#e4f4ef;color:var(--green)}.answers .no{background:#fff0f0;color:var(--red)}.answers .na{background:#eef0fb;color:#4357a0}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tiny{font-size:10px;color:var(--mut)}.progress{height:7px;border-radius:12px;background:#edf2f5;margin:10px 0 14px}.progress div{height:100%;border-radius:12px;background:var(--t)}.result{display:flex;gap:16px;align-items:center;background:#f0f8f8;padding:15px;border-radius:12px;margin:16px 0}.score{width:78px;height:78px;border:7px solid #a8ddd4;border-radius:50%;display:grid;place-items:center;background:white;color:var(--n);font-size:20px;font-weight:850}.hidden{display:none!important}.toast{display:none;position:fixed;bottom:18px;right:18px;padding:12px 16px;background:var(--n);color:white;border-radius:9px}.mobile{display:none}@media(max-width:850px){.app{grid-template-columns:65px 1fr}.side{padding:14px 7px}.brand div:last-child,.nav .label,.foot{display:none}.nav button{text-align:center;padding:12px 4px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:580px){.app{display:block}.side{display:none}.mobile{display:block}.top{padding:0 15px}.content{padding:22px 14px}.head{display:block}.head button{margin-top:10px}.form{grid-template-columns:1fr}.span2{grid-column:auto}.item{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.steps{flex-wrap:wrap}.top>span:first-child{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">S</div><div><b>SaúdeTech</b><small>Vistorias sanitárias</small></div></div><nav class="nav"><button data-page="home">▦ <span class="label"> Visão geral</span></button><button data-page="cadastro">＋ <span class="label"> Nova vistoria</span></button><button data-page="historico">◷ <span class="label"> Histórico</span></button><button data-page="gestor">▤ <span class="label"> Painel do gestor</span></button></nav><div class="foot">Protótipo acadêmico · dados fictícios</div></aside><main class="main"><header class="top"><span>Vigilância Sanitária / <b id="crumb">Visão geral</b></span><span class="mobile"><b>SaúdeTech</b></span><span>Agente sanitário <i class="avatar">AS</i></span></header><div class="content" id="view"></div></main></div><div id="toast" class="toast"></div><script>
const types={
'Beleza e estética':[
{id:'11110',cat:'Infraestrutura',sev:'Maior',w:2,text:'O estabelecimento está em boas condições de higiene e conservação, sem rachaduras ou infiltrações?'},
{id:'11082',cat:'Higiene',sev:'Crítico',w:4,text:'As instalações sanitárias dispõem de lavatório e insumos adequados para higienização das mãos?'},
{id:'11148',cat:'Procedimentos',sev:'Crítico',w:4,text:'Instrumentais reutilizáveis são esterilizados e guardados em recipiente limpo, separados dos itens sujos?'},
{id:'11085',cat:'Procedimentos',sev:'Crítico',w:4,text:'Materiais de uso único são descartados após o atendimento?'},
{id:'11106',cat:'Equipamentos',sev:'Menor',w:1,condition:'air',label:'Se houver ar-condicionado',text:'A manutenção dos aparelhos de ar-condicionado está registrada?'},
{id:'11228',cat:'Produtos',sev:'Maior',w:2,text:'Produtos utilizados têm registro e instruções em português e são armazenados corretamente?'}],
'Varejo de saneantes':[
{id:'11110',cat:'Infraestrutura',sev:'Menor',w:1,text:'O estabelecimento está em boas condições de higiene e conservação?'},
{id:'11225',cat:'Armazenamento',sev:'Menor',w:1,condition:'flammable',label:'Se houver inflamáveis ou explosivos',text:'Existe local adequado para produtos inflamáveis ou explosivos?'},
{id:'11136',cat:'Controle de pragas',sev:'Crítico',w:4,text:'O estabelecimento está livre de pragas e condições que favoreçam sua proliferação?'},
{id:'11228',cat:'Produtos',sev:'Crítico',w:4,text:'Os produtos químicos têm registro e instruções em português e são armazenados corretamente?'},
{id:'11163',cat:'Produtos',sev:'Crítico',w:4,text:'Os produtos estão dentro do prazo de validade?'},
{id:'11188',cat:'Documentação',sev:'Menor',w:1,allowNA:true,text:'Há certificado válido de controle químico, quando exigido?'}],
'Distribuidora de produtos para saúde':[
{id:'DOC01',cat:'Documentação',sev:'Maior',w:2,text:'A empresa apresenta licença/alvará aplicável e cadastro compatível com a atividade?'},
{id:'QMS01',cat:'Qualidade',sev:'Crítico',w:4,text:'Há procedimentos e registros de tratamento das não conformidades?'},
{id:'STO01',cat:'Armazenamento',sev:'Maior',w:2,text:'As condições de temperatura e umidade são monitoradas e registradas?'},
{id:'STO02',cat:'Armazenamento',sev:'Crítico',w:4,text:'Produtos vencidos, reprovados ou recolhidos ficam segregados e identificados?'},
{id:'TRC01',cat:'Rastreabilidade',sev:'Maior',w:2,text:'Há sistema de rastreabilidade por lote, série ou código equivalente?'},
{id:'IMP01',cat:'Importação',sev:'Maior',w:2,condition:'importer',label:'Somente se importadora',text:'Produtos importados possuem rótulo e instruções em português?'}]};
const ranking=[['Centro Médico Aurora','Centro',18,4],['Clínica Bela Vida','Gleba Palhano',15,2],['Distribuidora Norte Saúde','Jardim Quebec',12,3],['Estética Jardim','Centro',11,1],['Saneantes Londrina','Vila Nova',9,2],['Odonto Sul','Igapó',8,1],['Clínica Bem Estar','Centro',7,0],['Casa Limpa Produtos','Casoni',6,1],['OrtoVida','Jardim Leonor',5,0],['Espaço Essencial','Aeroporto',4,0]];
const S={page:'home',type:'Beleza e estética',name:'',cnpj:'',bairro:'Centro',address:'',answers:{},notes:{},air:true,flammable:true,importer:false};const labels={home:'Visão geral',cadastro:'Nova vistoria',checklist:'Checklist',relatorio:'Relatório final',historico:'Histórico',gestor:'Painel do gestor'};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function go(p){S.page=p;render()}function msg(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function head(title,sub,action=''){return `<div class="head"><div class="desc"><div class="eyebrow">SaúdeTech · VISA Londrina</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function bar(r,max){return `<div class="bar"><span>${r[0]}</span><div class="track"><div class="fill" style="width:${Math.round(r[2]/max*100)}%"></div></div><b>${r[2]}</b></div>`}
function home(){return `${head('Bom dia, agente','Acompanhe suas vistorias e inicie um atendimento.','<button class="primary" onclick="start()">＋ Nova vistoria</button>')}<div class="grid stats"><div class="card metric"><small>Vistorias hoje</small><strong>6</strong><span>2 em andamento</span></div><div class="card metric"><small>Aguardando sincronização</small><strong>2</strong><span>Última conexão há 8 min</span></div><div class="card metric"><small>Estabelecimentos</small><strong>48</strong><span>Dados demonstrativos</span></div><div class="card metric"><small>Achados críticos</small><strong>9</strong><span>Últimos 30 dias</span></div></div><div class="grid cols"><section class="card"><h2>Agenda de hoje</h2><table class="table"><tr><th>Hora</th><th>Estabelecimento</th><th>Tipo</th><th>Status</th></tr><tr><td>09:00</td><td>Estética Jardim</td><td>Beleza</td><td><span class="badge">Concluída</span></td></tr><tr><td>10:30</td><td>Clínica Aurora</td><td>Saúde</td><td><span class="badge warn">Em andamento</span></td></tr><tr><td>14:00</td><td>Casa Limpa Produtos</td><td>Saneantes</td><td><span class="badge">Agendada</span></td></tr></table><p class="tiny">Estabelecimentos e dados fictícios.</p></section><section class="card"><h2>I06 · Mais não conformidades</h2><p>Ranking demonstrativo para priorização.</p>${ranking.slice(0,5).map(r=>bar(r,18)).join('')}<button class="ghost" onclick="go('gestor')">Abrir painel completo</button></section></div>`}
function start(){S.answers={};S.notes={};S.page='cadastro';render()}function flow(n){return `<div class="steps"><span class="step ${n===1?'on':''}">1 Cadastro</span><i class="sep"></i><span class="step ${n===2?'on':''}">2 Checklist</span><i class="sep"></i><span class="step ${n===3?'on':''}">3 Relatório</span></div>`}
function cadastro(){return `${head('Identificar estabelecimento','O tipo selecionado define o roteiro que será carregado.')}<div class="card">${flow(1)}<div class="form"><div class="field"><label>Razão social *</label><input id="name" value="${S.name}" placeholder="Ex.: Clínica Aurora"></div><div class="field"><label>CNPJ *</label><input id="cnpj" value="${S.cnpj}" placeholder="00.000.000/0000-00"></div><div class="field span2"><label>Endereço *</label><input id="address" value="${S.address}" placeholder="Rua, número, complemento"></div><div class="field"><label>Bairro *</label><input id="bairro" value="${S.bairro}" placeholder="Bairro"></div><div class="field"><label>Tipo de estabelecimento *</label><select id="type">${Object.keys(types).map(t=>`<option ${S.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="callout">Cadastro e consulta por CNPJ são simulados; nenhuma base real está conectada.</div><div class="actions"><button class="ghost" onclick="go('home')">Cancelar</button><button class="primary" onclick="save()">Carregar checklist →</button></div></div>`}
function save(){for(let id of ['name','cnpj','address','bairro'])S[id==='name'?'name':id==='cnpj'?'cnpj':id==='address'?'address':'bairro']=document.getElementById(id).value.trim();S.type=document.getElementById('type').value;if(!S.name||!S.cnpj||!S.address||!S.bairro){msg('Preencha os campos obrigatórios.');return}S.page='checklist';render()}
function getItems(){return types[S.type].filter(x=>!x.condition||(x.condition==='air'&&S.air)||(x.condition==='flammable'&&S.flammable)||(x.condition==='importer'&&S.importer))}
function checklist(){let its=getItems(),done=its.filter(x=>S.answers[x.id]).length;let conditional='';if(S.type==='Beleza e estética')conditional=`<label class="callout"><input type="checkbox" ${S.air?'checked':''} onchange="S.air=this.checked;render()"> Há aparelho de ar-condicionado? O item de manutenção fica ${S.air?'incluído':'fora do roteiro'}.</label>`;if(S.type==='Varejo de saneantes')conditional=`<label class="callout"><input type="checkbox" ${S.flammable?'checked':''} onchange="S.flammable=this.checked;render()"> Há produtos inflamáveis/explosivos?</label>`;if(S.type==='Distribuidora de produtos para saúde')conditional=`<label class="callout"><input type="checkbox" ${S.importer?'checked':''} onchange="S.importer=this.checked;render()"> A empresa é importadora?</label>`;return `${head('Checklist de vistoria',`${S.name} · ${S.type}`)}<div class="card">${flow(2)}<div style="display:flex;justify-content:space-between"><div><h2>Roteiro aplicável</h2><p>Versão demonstrativa · ${its.length} itens</p></div><span class="badge">${done}/${its.length} respondidos</span></div><div class="progress"><div style="width:${Math.round(done/its.length*100)}%"></div></div>${conditional}${its.map(x=>`<article class="item"><div><div class="meta"><span class="badge">${x.cat}</span><span class="badge ${x.sev==='Crítico'?'bad':'warn'}">${x.sev}</span><span class="badge">Peso ${x.w}</span>${x.label?`<span class="badge warn">${x.label}</span>`:''}</div><p><b>${x.id}</b> · ${x.text}</p>${S.answers[x.id]==='nao_conforme'?`<div class="field"><label>Descreva o achado ${x.sev==='Crítico'?'*':''}</label><textarea onchange="S.notes['${x.id}']=this.value">${S.notes[x.id]||''}</textarea></div>`:S.answers[x.id]==='nao_aplicavel'?`<div class="field"><label>Justificativa para N/A *</label><textarea onchange="S.notes['${x.id}']=this.value">${S.notes[x.id]||''}</textarea></div>`:''}</div><div class="answers"><button class="${S.answers[x.id]==='conforme'?'ok':''}" onclick="answer('${x.id}','conforme')">Conforme</button><button class="${S.answers[x.id]==='nao_conforme'?'no':''}" onclick="answer('${x.id}','nao_conforme')">Não conforme</button>${x.allowNA?`<button class="${S.answers[x.id]==='nao_aplicavel'?'na':''}" onclick="answer('${x.id}','nao_aplicavel')">N/A</button>`:''}</div></article>`).join('')}<p class="tiny">Itens e severidades são exemplos retirados dos roteiros anexos; pesos e validade municipal exigem revisão.</p><div class="actions"><button class="ghost" onclick="go('cadastro')">← Voltar</button><button class="primary" onclick="finish()">Finalizar vistoria →</button></div></div>`}
function answer(id,val){S.answers[id]=val;render()}function calc(){let its=getItems(),ev=its.filter(x=>S.answers[x.id]&&S.answers[x.id]!=='nao_aplicavel'),den=ev.reduce((a,x)=>a+x.w,0),num=ev.filter(x=>S.answers[x.id]==='conforme').reduce((a,x)=>a+x.w,0),score=den?Math.round(num*100/den):null,critical=its.some(x=>x.sev==='Crítico'&&S.answers[x.id]==='nao_conforme'),cls=score===null?'Sem itens avaliáveis':critical||score<70?'Não conforme':score<90?'Parcialmente conforme':'Conforme';return{its,ev,den,num,score,critical,cls}}
function finish(){let c=calc(),pending=c.its.filter(x=>!S.answers[x.id]),bad=c.its.filter(x=>x.sev==='Crítico'&&S.answers[x.id]==='nao_conforme'&&!S.notes[x.id]);if(pending.length){msg('Responda todos os itens aplicáveis.');return}if(bad.length){msg('Descreva o achado crítico ou justifique N/A antes de finalizar.');return}if(!c.den){msg('Sem itens avaliáveis; revise o roteiro.');return}S.page='relatorio';render()}
function report(){let c=calc(),ok=c.ev.filter(x=>S.answers[x.id]==='conforme').length,no=c.ev.filter(x=>S.answers[x.id]==='nao_conforme').length,na=c.its.filter(x=>S.answers[x.id]==='nao_aplicavel').length;return `${head('Relatório de vistoria','Registro demonstrativo · #DEMO-026')}<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">${S.name} · ${S.bairro}</div><h2 style="margin:4px 0">${S.type}</h2><p>Agente sanitário · 03 nov. 2026 · 10:42</p></div><span class="badge ${c.cls==='Conforme'?'':c.cls==='Parcialmente conforme'?'warn':'bad'}">${c.cls}</span></div><div class="result"><div class="score">${c.score??'—'}${c.score===null?'':'%'}</div><div><h2>Conformidade ponderada</h2><p>${c.critical?'Existe item crítico não conforme. ':''}${c.ev.length} avaliáveis · ${ok} conformes · ${no} não conformes · ${na} N/A</p><span class="tiny">Faixas e pesos acadêmicos, sujeitos a validação.</span></div></div>${no?`<h2>Achados a acompanhar</h2>${c.its.filter(x=>S.answers[x.id]==='nao_conforme').map(x=>`<div class="item"><div><span class="badge bad">${x.sev}</span><p>${x.text}</p><p class="tiny">${S.notes[x.id]||'Sem observação'}</p></div></div>`).join('')}`:''}<div class="notice">Assinatura, emissão oficial e envio ao sistema municipal são conceitos de protótipo. Este relatório não substitui ato administrativo.</div><div class="actions"><button class="ghost" onclick="go('checklist')">← Revisar respostas</button><div><button class="secondary" onclick="window.print()">Imprimir</button> <button class="primary" onclick="msg('Salvo no histórico demonstrativo.')">Encerrar</button></div></div></div>`}
function history(){return `${head('Histórico de vistorias','Compare resultados e acompanhe reincidências.')}<div class="card"><div class="form"><div class="field"><label>Buscar</label><input placeholder="Estabelecimento ou bairro"></div><div class="field"><label>Classificação</label><select><option>Todas</option><option>Conforme</option><option>Parcialmente conforme</option><option>Não conforme</option></select></div></div><table class="table"><tr><th>Data</th><th>Estabelecimento</th><th>Tipo</th><th>Resultado</th><th>NCs</th></tr><tr><td>03/11/2026</td><td>Clínica Aurora</td><td>Saúde</td><td><span class="badge warn">Parcial</span></td><td>3</td></tr><tr><td>12/08/2026</td><td>Clínica Aurora</td><td>Saúde</td><td><span class="badge">Conforme</span></td><td>0</td></tr><tr><td>28/10/2026</td><td>Estética Jardim</td><td>Beleza</td><td><span class="badge bad">Não conforme</span></td><td>5</td></tr></table><p class="tiny">Histórico fictício para demonstrar comparação.</p></div>`}
function gestor(){return `${head('Painel do gestor','Indicadores para orientar prioridades de acompanhamento.')}<div class="grid stats"><div class="card metric"><small>Vistorias</small><strong>124</strong><span>últimos 30 dias</span></div><div class="card metric"><small>Não conformes</small><strong>27</strong><span>21,8% no período</span></div><div class="card metric"><small>Reincidentes</small><strong>11</strong><span>duas ou mais visitas</span></div><div class="card metric"><small>Pendentes de sincronização</small><strong>2</strong><span>revisar</span></div></div><div class="card"><h2>I06 · Quais os 10 estabelecimentos com mais não conformidades?</h2><p>Ranking ilustrativo; SQL real deve ser validado no banco.</p><table class="table"><tr><th>#</th><th>Razão social</th><th>Bairro</th><th>Não conformidades</th><th>Críticas</th></tr>${ranking.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td><td>${r[3]?`<span class="badge bad">${r[3]}</span>`:'0'}</td></tr>`).join('')}</table><p class="tiny">Dados inteiramente fictícios. I06 é o indicador do laboratório de dashboard e não define a classificação da vistoria.</p><div class="notice">Roteiros anexos têm referências e vigências diversas; validar roteiro oficial de Londrina antes de uso.</div></div>`}
function render(){document.getElementById('crumb').textContent=labels[S.page];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));document.getElementById('view').innerHTML=({home,cadastro,checklist,relatorio:report,historico:history,gestor})[S.page]()}
render();</script></body></html>
